version: 2

models:
  - name: fct_mrr
    description: "Fact table containing one row per MRR event per customer"
    columns:
      - name: event_id
        description: "Unique identifier for each MRR event"
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "Foreign key to dim_customers"
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

      - name: mrr_event_type
        description: "Type of MRR event"
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'expansion', 'churned']

      - name: mrr_amount_usd
        description: "MRR amount in USD. Negative for churned events."
        tests:
          - not_null

      - name: mrr_month
        description: "Month of the MRR event truncated to first of month"
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension table with one row per customer"
    columns:
      - name: customer_id
        description: "Unique identifier for each customer"
        tests:
          - unique
          - not_null

      - name: customer_email
        description: "Customer email address"
        tests:
          - unique
          - not_null

      - name: subscription_status
        description: "Current subscription status"
        tests:
          - not_null
          - accepted_values:
              values: ['active', 'churned', 'upgraded']

      - name: plan_name
        description: "Subscription plan name"
        tests:
          - not_null
          - accepted_values:
              values: ['starter', 'growth', 'business', 'enterprise']